services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: parachute-pgvector
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-parachute}
      POSTGRES_USER: ${POSTGRES_USER:-parachute}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-parachute}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - parachute_pgdata:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  parachute_pgdata:
